<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1a0b2e">
  <title>Kinh Dịch · Huyền Học AI</title>
  <style>
    body { margin:0; padding:24px 14px; color:#e8dff5; background:#0f0524; font:16px system-ui,sans-serif; }
    main { width:min(850px,100%); margin:auto; } h1,h2 { color:#c4a3ff; }
    nav, .actions { display:flex; flex-wrap:wrap; gap:9px; margin:16px 0; }
    a, button { padding:9px 13px; border:1px solid #c4a3ff; border-radius:8px; color:#e8dff5; background:#7138d6; text-decoration:none; cursor:pointer; }
    nav a { background:transparent; } textarea { width:100%; padding:10px; border:1px solid #c4a3ff66; border-radius:8px; color:#fff; background:#170b2d; font:inherit; }
    label { display:block; margin:10px 0 5px; color:#c7b8d8; } .card { margin:10px 0; padding:14px; border:1px solid #c4a3ff55; border-radius:10px; background:#ffffff0b; }
    .muted { color:#b6a1d2; font-size:.9rem; } .error { color:#ff9999; }
  </style>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body><main>
  <h1>☯ Gieo quẻ Kinh Dịch</h1>
  <p class="muted">Sáu hào được gieo ngẫu nhiên bằng phương pháp ba đồng xu. Diễn giải chỉ để tham khảo văn hóa, không phải lời khuyên chuyên môn.</p>
  <form id="form"><label for="question">Câu hỏi để suy ngẫm (5–500 ký tự)</label>
    <textarea id="question" required minlength="5" maxlength="500" rows="4"></textarea>
    <div class="actions"><button id="submit" type="submit">Gieo quẻ</button></div>
  </form>
  <section id="result" aria-live="polite"></section>
</main>
<script>
  const token = localStorage.getItem("token");
  if (!token) window.location.replace("/");  const result = document.getElementById("result");
  function text(parent, tag, value, className) {
    const node = document.createElement(tag); node.textContent = value ?? "";
    if (className) node.className = className;
    parent.append(node); return node;
  }
  function renderHexagram(parent, hexagram, title) {
    if (!hexagram) return;
    const section = document.createElement("article"); section.className = "card";
    text(section, "h2", `${title}: Quẻ ${hexagram.so} · ${hexagram.ten}`);
    text(section, "p", hexagram.chu_de);
    text(section, "p", `Thượng quái ${hexagram.thuong_quai.ten} ${hexagram.thuong_quai.tuong} · Hạ quái ${hexagram.ha_quai.ten} ${hexagram.ha_quai.tuong}`);
    for (const hao of hexagram.hao || []) text(section, "div", `Hào ${hao.vi_tri}: ${hao.duong ? "Dương —" : "Âm  -"} ${hao.dong ? "(động)" : ""}`);
    parent.append(section);
  }
  document.getElementById("form").addEventListener("submit", async event => {
    event.preventDefault();
    const button = document.getElementById("submit"); button.disabled = true;
    result.replaceChildren(); text(result, "p", "Đang gieo quẻ và diễn giải…", "muted");
    try {
      const response = await fetch("/api/kinh-dich", {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
        body: JSON.stringify({ cau_hoi: document.getElementById("question").value })
      });
      const data = await response.json().catch(() => ({}));
      if (response.status === 401) { localStorage.clear(); window.location.replace("/"); return; }
      if (!response.ok) throw new Error(data.detail || `Yêu cầu thất bại (${response.status}).`);
      result.replaceChildren();
      renderHexagram(result, data.que_chinh, "Quẻ chính");
      renderHexagram(result, data.que_bien, "Quẻ biến");
      const interpretation = data.luan_giai || {};
      text(result, "h2", "Diễn giải");
      text(result, "p", interpretation.thong_diep);
      for (const item of interpretation.goi_y_hanh_dong || []) text(result, "p", `Gợi ý: ${item.hanh_dong || item}`);
      for (const item of interpretation.diem_can_can_nhac || []) text(result, "p", `Cân nhắc: ${item}`);
      text(result, "p", interpretation.gioi_han, "muted");
      text(result, "p", data.ghi_chu, "muted");
    } catch (error) {
      result.replaceChildren(); text(result, "p", error.message || "Không thể hoàn tất yêu cầu.", "error");
    } finally { button.disabled = false; }
  });
</script>  <script src="/nav.js"></script>
</body>
</html>
