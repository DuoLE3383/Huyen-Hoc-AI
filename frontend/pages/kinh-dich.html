<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1a0b2e">
  <title>Kinh Dịch · Huyền Học AI</title>
  <style>
    body { margin:0; padding:24px 14px; color:#e8dff5; background:#0f0524; font:16px system-ui,sans-serif; }
    main { width:min(850px,100%); margin:auto; } h1,h2 { color:#c4a3ff; }
    nav, .actions { display:flex; flex-wrap:wrap; gap:9px; margin:16px 0; }
    a, button { padding:9px 13px; border:1px solid #c4a3ff; border-radius:8px; color:#e8dff5; background:#7138d6; text-decoration:none; cursor:pointer; }
    nav a { background:transparent; } textarea { width:100%; padding:10px; border:1px solid #c4a3ff66; border-radius:8px; color:#fff; background:#170b2d; font:inherit; }
    label { display:block; margin:10px 0 5px; color:#c7b8d8; } .card { margin:10px 0; padding:14px; border:1px solid #c4a3ff55; border-radius:10px; background:#ffffff0b; }
    .muted { color:#b6a1d2; font-size:.9rem; } .error { color:#ff9999; }
    /* Loading animation */
    .loading-box { display:flex; flex-direction:column; align-items:center; gap:14px; padding:36px 16px; margin:20px 0; border:1px solid #c4a3ff33; border-radius:14px; background:#ffffff08; }
    .bagua { font-size:72px; line-height:1; animation: spin 3s linear infinite; filter: drop-shadow(0 0 12px #c4a3ff88); }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-title { font-size:1.1rem; color:#c4a3ff; font-weight:600; letter-spacing:.5px; }
    .loading-text { font-size:1rem; color:#e8dff5; min-height:1.5em; animation: fade 1.2s ease-in-out infinite; text-align:center; }
    @keyframes fade { 50% { opacity: 0.4; } }
    .loading-dots span { animation: blink 1.4s infinite both; }
    .loading-dots span:nth-child(2) { animation-delay: .2s; }
    .loading-dots span:nth-child(3) { animation-delay: .4s; }
    @keyframes blink { 0%,80%,100% { opacity: 0; } 40% { opacity: 1; } }
    .progress-bar { width:min(320px,90%); height:4px; background:#c4a3ff22; border-radius:2px; overflow:hidden; }
    .progress-bar::after { content:""; display:block; height:100%; width:40%; background:linear-gradient(90deg, transparent, #c4a3ff, transparent); animation: slide 1.6s ease-in-out infinite; }
    @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }
    /* Suggestion tags */
    .suggest-tags { display:flex; flex-wrap:wrap; gap:8px; margin:10px 0 14px; }
    .suggest-tag { padding:7px 12px; border:1px solid #c4a3ff66; border-radius:18px; background:#ffffff08; color:#e8dff5; font-size:.9rem; cursor:pointer; user-select:none; transition: all .15s ease; }
    .suggest-tag:hover { background:#7138d6; border-color:#c4a3ff; transform: translateY(-1px); }
    .suggest-tag:active { transform: scale(.96); }
    .suggest-hint { font-size:.85rem; color:#b6a1d2; margin:0 0 6px; }
  
 }
    .stage-sub2 { font-size:.85rem; color:#b6a1d2; margin-top:2px; }
  

    .stage-sub2 { font-size:.88rem; color:#b6a1d2; }

  
    .quai-info { display:flex; gap:20px; justify-content:center; margin-top:8px; padding:8px 14px; border:1px solid #c4a3ff33; border-radius:8px; background:#ffffff06; font-size:.9rem; }
    .quai-info span { color:#e8dff5; }
    .quai-info b { color:#c4a3ff; font-weight:600; }
    .quai-info .sym { font-size:1.2rem; margin-left:6px; }

      /* ── 3 đồng xu cổ gieo quẻ ── */
    .coin-stage { display:flex; flex-direction:column; align-items:center; gap:14px; margin-top:16px; padding:20px 12px; border:1px solid #c4a3ff22; border-radius:14px; background:linear-gradient(180deg,#ffffff08,#ffffff03); animation: fadeIn .5s ease; }
    .coin-tray { display:flex; gap:20px; justify-content:center; align-items:center; min-height:64px; padding:6px 0; }
    .coin-wrap { width:56px; height:56px; perspective:400px; }
    .coin-3d { width:100%; height:100%; position:relative; transform-style:preserve-3d; animation: spin 1s linear infinite; }
    .coin-3d.landed { animation: none; }
    .coin-face {
      position:absolute; inset:0; border-radius:50%;
      backface-visibility:hidden; -webkit-backface-visibility:hidden;
      display:flex; align-items:center; justify-content:center;
      font-family:"Noto Serif", serif; font-weight:700;
      overflow:hidden;
    }
    .coin-face.front {
      background: radial-gradient(circle at 35% 30%, #ffea99 0%, #f0cc5e 25%, #d4a017 55%, #8a6508 90%);
      box-shadow: 0 4px 14px #d4a01755, inset 0 -3px 8px #8a650899, inset 0 3px 6px #fff8;
      color:#5a3a00;
    }
    .coin-face.back {
      background: radial-gradient(circle at 35% 30%, #c8a04a 0%, #a88032 25%, #6b4a0d 55%, #3a2505 90%);
      box-shadow: 0 4px 14px #6b4a0d55, inset 0 -3px 8px #3a250599, inset 0 3px 6px #e7c98755;
      color:#f0d27a;
      transform: rotateY(180deg);
    }
    /* Viền tròn ngoài */
    .coin-face::before {
      content:""; position:absolute; inset:4px;
      border:1.5px solid currentColor; opacity:.5; border-radius:50%;
      pointer-events:none;
    }
    /* Lỗ vuông ở giữa */
    .coin-face::after {
      content:""; position:absolute; top:50%; left:50%;
      width:16px; height:16px; transform: translate(-50%,-50%);
      background:#0f0524;
      border:1px solid currentColor;
      box-shadow: inset 0 0 4px #000000cc, 0 0 0 1px currentColor inset;
      pointer-events:none;
    }
    /* Chữ Hán quanh lỗ */
    .coin-face span {
      position:absolute; font-size:10px; font-weight:700;
      color:currentColor; line-height:1; text-shadow:0 1px 0 #fff2;
      z-index:1;
    }
    .coin-face .cn-top    { top:5px;  left:50%; transform: translateX(-50%); }
    .coin-face .cn-bottom { bottom:5px; left:50%; transform: translateX(-50%); }
    .coin-face .cn-left   { left:5px;  top:50%; transform: translateY(-50%); }
    .coin-face .cn-right  { right:5px; top:50%; transform: translateY(-50%); }
    @keyframes spin { from { transform: rotateY(0); } to { transform: rotateY(360deg); } }
    @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
    .coin-result-label { font-size:.82rem; color:#e8dff5; text-align:center; margin-top:-4px; font-family: ui-monospace, monospace; }
    .haos-list { display:flex; flex-direction:column; gap:7px; width:min(300px,92%); margin-top:6px; }
    .hao-line { display:flex; align-items:center; gap:10px; opacity:0; transform: translateX(-16px); animation: hao-appear .5s ease forwards; }
    .hao-num { font-size:.78rem; color:#b6a1d2; min-width:52px; }
    .hao-bar { flex:1; height:13px; display:flex; gap:5px; }
    .hao-bar .solid { flex:1; height:100%; background:linear-gradient(90deg, #c4a3ff, #a48cf0); border-radius:3px; box-shadow:0 0 8px #c4a3ff77; }
    .hao-bar .broken { flex:1; height:100%; display:flex; gap:5px; }
    .hao-bar .broken > span { flex:1; background:linear-gradient(90deg, #c4a3ff, #a48cf0); border-radius:3px; box-shadow:0 0 8px #c4a3ff77; }
    .hao-label { font-size:.75rem; color:#b6a1d2; min-width:70px; text-align:right; }
    .hao-dong { color:#f5d76e; font-weight:600; }
    .stage-sub2 { font-size:.88rem; color:#b6a1d2; }
    .quai-info { display:flex; gap:20px; justify-content:center; margin-top:8px; padding:8px 14px; border:1px solid #c4a3ff33; border-radius:8px; background:#ffffff06; font-size:.9rem; }
    .quai-info span { color:#e8dff5; }
    .quai-info b { color:#c4a3ff; font-weight:600; }
    .quai-info .sym { font-size:1.2rem; margin-left:6px; }
    @keyframes hao-appear { to { opacity:1; transform: translateX(0); } }

  
    /* Phân biệt Lão (động) vs Thiếu (tĩnh) */
    .hao-bar .solid.lao { background:linear-gradient(90deg, #f5d76e, #e6b800); box-shadow:0 0 10px #f5d76eaa; }
    .hao-bar .broken.lao > span { background:linear-gradient(90deg, #f5d76e, #e6b800); box-shadow:0 0 10px #f5d76eaa; }
    .hao-bar .lao-mark { position:absolute; font-size:14px; color:#f5d76e; font-weight:700; }
    .hao-line { position:relative; }
    .hao-bar { position:relative; }
    .hao-bar .mark-o { position:absolute; right:-22px; top:50%; transform:translateY(-50%); color:#f5d76e; font-size:13px; font-weight:700; }
    .hao-bar .mark-x { position:absolute; right:-22px; top:50%; transform:translateY(-50%); color:#f5d76e; font-size:14px; font-weight:700; }

  
    /* Layout mới cho loading */
    .loading-box { display:flex !important; flex-direction:column !important; align-items:center !important; gap:20px !important; padding:40px 24px !important; margin:24px auto !important; max-width:640px !important; border:1px solid #c4a3ff33 !important; border-radius:20px !important; background:radial-gradient(circle at 50% 0%, #c4a3ff15, #ffffff06) !important; }
    .loading-box .bagua { font-size:96px !important; }
    .loading-box .coin-stage { padding:24px !important; gap:20px !important; margin:0 !important; border:none !important; background:transparent !important; }
    .loading-box .coin-row { gap:24px !important; }
    .loading-box .coin { width:72px !important; height:72px !important; font-size:28px !important; }
    .loading-box .coin-face span { font-size:13px !important; }
    .loading-box .coin-face::after { width:22px !important; height:22px !important; }
    .loading-box .haos-list { width:min(420px,95%) !important; }
    .loading-box .hao-bar { height:16px !important; }
    .loading-box .hao-num { font-size:.9rem !important; min-width:70px !important; }
    .loading-box .hao-label { font-size:.85rem !important; min-width:90px !important; }
    .loading-box .coin-result-label { font-size:1rem !important; }

    /* Layout 2 cột khi có kết quả */
    .result-grid { display:grid !important; grid-template-columns:1.2fr 1fr !important; gap:24px !important; margin-bottom:32px !important; }
    @media (max-width: 768px) { .result-grid { grid-template-columns:1fr !important; } }

    /* Section headers đẹp hơn */
    .section-title { color:#c4a3ff !important; margin-top:24px !important; margin-bottom:10px !important; font-size:1.15rem !important; font-weight:600 !important; border-bottom:1px solid #c4a3ff22 !important; padding-bottom:6px !important; }

  

  


  

  
    /* ── Modal chính (1 khung) chứa 3 cột ── */
    .main-modal { padding:24px !important; border:1px solid #c4a3ff44 !important; border-radius:20px !important; background:radial-gradient(circle at 50% 0%, #c4a3ff10, #0f0524) !important; box-shadow:0 16px 40px #00000055 !important; margin-bottom:28px !important; }
    .main-modal .modal-grid { display:grid !important; grid-template-columns:1fr 1fr 1fr !important; gap:20px !important; align-items:start !important; }
    @media (max-width: 900px) { .main-modal .modal-grid { grid-template-columns:1fr !important; } }
    .main-modal .modal-grid > div { min-width:0 !important; }
    .main-modal .coin-stage { margin:0 !important; padding:16px !important; background:transparent !important; border:none !important; }
    .main-modal .coin { width:54px !important; height:54px !important; }
    .main-modal .haos-list { width:100% !important; }
    .main-modal .hao-num { font-size:.75rem !important; min-width:50px !important; }
    .main-modal .hao-label { font-size:.72rem !important; min-width:60px !important; }
    .main-modal .coin-result-label { font-size:.75rem !important; }
    .main-modal h2 { font-size:1.05rem !important; margin-bottom:8px !important; }
    .main-modal p { font-size:.85rem !important; margin:3px 0 !important; }

    /* ── Textbox + nút gieo ── */
    .input-wrap { position:relative !important; margin-bottom:16px !important; }
    .input-wrap textarea { padding-bottom:64px !important; min-height:120px !important; }
    .input-wrap #submit { position:absolute !important; bottom:12px !important; right:12px !important; padding:10px 24px !important; font-size:.95rem !important; margin:0 !important; }
    @media (max-width: 500px) { .input-wrap #submit { position:static !important; width:100% !important; margin-top:8px !important; } .input-wrap textarea { padding-bottom:12px !important; } }

  </style>

<body><main>
  <h1>☯ Gieo quẻ Kinh Dịch</h1>
  <p class="muted">Sáu hào được gieo ngẫu nhiên bằng phương pháp ba đồng xu. Diễn giải chỉ để tham khảo văn hóa, không phải lời khuyên chuyên môn.</p>
  <form id="form">
    <label for="question">Câu hỏi để suy ngẫm (5–500 ký tự)</label>
    <p class="suggest-hint">💡 Gợi ý — bấm để thêm vào câu hỏi:</p>
    <div class="suggest-tags" id="suggestTags">
      <button type="button" class="suggest-tag" data-text="Tôi có nên tiến tới mối quan hệ này không?">💕 Tình duyên</button>
      <button type="button" class="suggest-tag" data-text="Công việc sắp tới của tôi sẽ như thế nào?">💼 Sự nghiệp</button>
      <button type="button" class="suggest-tag" data-text="Sức khỏe của tôi trong thời gian tới ra sao?">🌿 Sức khỏe</button>
      <button type="button" class="suggest-tag" data-text="Tài chính của tôi nên đầu tư hay tiết kiệm?">💰 Tài vận</button>
      <button type="button" class="suggest-tag" data-text="Tôi có nên theo đuổi ngành học này không?">🎓 Học hành</button>
      <button type="button" class="suggest-tag" data-text="Mối quan hệ gia đình tôi cần lưu ý điều gì?">🏠 Gia đình</button>
      <button type="button" class="suggest-tag" data-text="Tôi có nên thực hiện chuyến đi này không?">✈️ Xuất hành</button>
      <button type="button" class="suggest-tag" data-text="Tôi nên chọn ai làm cộng sự tin cậy?">🤝 Bạn bè</button>
    </div>
    <div class="input-wrap">
      <textarea id="question" required minlength="5" maxlength="500" rows="4" placeholder="Ví dụ: Tôi có nên chuyển việc trong 3 tháng tới không?"></textarea>
      <button id="submit" type="submit">Gieo quẻ</button>
    </div>
  </form>
  <section id="result" aria-live="polite"></section>
</main>
<script>
  const token = localStorage.getItem("token"); // optional, có thể null  const result = document.getElementById("result");
  function text(parent, tag, value, className) {
    const node = document.createElement(tag); node.textContent = value ?? "";
    if (className) node.className = className;
    parent.append(node); return node;
  }
  function renderHexagram(parent, hexagram, title) {
    if (!hexagram) return;
    const section = document.createElement("article"); section.className = "card";
    text(section, "h2", `${title}: Quẻ ${hexagram.so} · ${hexagram.ten}`);
    text(section, "p", hexagram.chu_de);
    text(section, "p", `Thượng quái ${hexagram.thuong_quai.ten} ${hexagram.thuong_quai.tuong} · Hạ quái ${hexagram.ha_quai.ten} ${hexagram.ha_quai.tuong}`);
    for (const hao of hexagram.hao || []) {
      const line = document.createElement("div");
      const duong = hao.duong;
      const sym = duong ? "Dương —" : "Âm  -";
      const color = duong ? "#f5d76e" : "#8fd9a8";
      line.innerHTML = `Hào ${hao.vi_tri}: <span style="color:${color};font-weight:600">${sym}</span> ${hao.dong ? '<span style="color:#ff9999">(động)</span>' : ""}`;
      section.append(line);
    }
    parent.append(section);
  }
  const LOADING_MESSAGES = [
    "🔮 Đang kết nối cõi vô hình...",
    "☯ Đang gieo 3 đồng xu 6 lần...",
    "📜 Đang tra cứu 64 quẻ Kinh Dịch...",
    "🧠 Đang luận giải ý nghĩa...",
    "✨ Sắp xong rồi, bạn kiên nhẫn nhé...",
  ];
  let loadingTimer = null;

  function showLoading() {
    const box = document.createElement("div");
    box.className = "loading-box";
    box.innerHTML = `
      <div class="bagua">☯</div>
      <div class="loading-title">Đang gieo quẻ</div>
      <div class="loading-text" id="loadingText">${LOADING_MESSAGES[0]}</div>
      <div class="progress-bar"></div>
      <div class="muted loading-dots">Vui lòng đợi <span>.</span><span>.</span><span>.</span></div>
    `;
    result.replaceChildren(box);
    let i = 0;
    const textTimer = setInterval(() => {
      i = (i + 1) % LOADING_MESSAGES.length;
      const el = document.getElementById("loadingText");
      if (el) el.textContent = LOADING_MESSAGES[i];
    }, 2500);

    // Sau 3.5s → thêm khối đồng xu vào bên dưới (không thay thế loading)
    const coinTimer = setTimeout(() => {
      const stage = document.createElement("div");
      stage.className = "coin-stage";
      stage.innerHTML = `
        <div class="coin-tray" id="coinTray"></div>
        <div class="coin-result-label" id="coinSub">Chuẩn bị gieo hào 1/6...</div>
        <div class="haos-list" id="haosList"></div>
        <div class="quai-info" id="quaiInfo" style="display:none">
          <span>Thượng quái: <b id="thuongQuai">—</b><span class="sym" id="thuongSym"></span></span>
          <span>Hạ quái: <b id="haQuai">—</b><span class="sym" id="haSym"></span></span>
        </div>
      `;
      result.querySelector(".loading-box")?.append(stage);
      animateHaos();
    }, 3500);

    // Lưu để clear khi có kết quả
    loadingTimer = { textTimer, coinTimer };
  }

  // ── Sinh 3 đồng xu kết quả cho 1 hào ──
  // Return: { coins: [bool, bool, bool], tong: 6|7|8|9, hao: "duong"|"am", dong: bool, label: string }
  function tossCoins() {
    const coins = [Math.random() > 0.5, Math.random() > 0.5, Math.random() > 0.5]; // true = Sấp (Dương)
    const tong = coins.reduce((sum, c) => sum + (c ? 3 : 2), 0);
    // 6=Lão Âm, 7=Thiếu Dương, 8=Thiếu Âm, 9=Lão Dương
    let hao, dong;
    if (tong === 6) { hao = "am";   dong = true; }
    else if (tong === 7) { hao = "duong"; dong = false; }
    else if (tong === 8) { hao = "am";   dong = false; }
    else { hao = "duong"; dong = true; }
    const label = tong === 9 ? "Lão Dương" : tong === 6 ? "Lão Âm" : tong === 8 ? "Thiếu Âm" : "Thiếu Dương";
    return { coins, tong, hao, dong, label };
  }

  function renderCoinTray(container, coins, showResult) {
    container.innerHTML = "";
    coins.forEach(c => {
      const wrap = document.createElement("div");
      wrap.className = "coin-wrap";
      const c3d = document.createElement("div");
      c3d.className = "coin-3d" + (showResult ? " landed" : "");
      if (showResult) {
        // Mặt Dương = front, Âm = back
        c3d.style.transform = c ? "rotateY(0deg)" : "rotateY(180deg)";
      }
      const front = document.createElement("div");
      front.className = "coin-face front";
      front.innerHTML = '<span class="cn-top">乾</span><span class="cn-bottom">元</span><span class="cn-left">通</span><span class="cn-right">寶</span>';
      const back = document.createElement("div");
      back.className = "coin-face back";
      back.innerHTML = '<span class="cn-top">坤</span><span class="cn-bottom">順</span><span class="cn-left">承</span><span class="cn-right">天</span>';
      c3d.append(front, back);
      wrap.append(c3d);
      container.append(wrap);
    });
  }

  // Trigram theo 3 hào (từ dưới lên): true = Dương
  const TRIGRAM_MAP = {
    "111": ["Càn", "☰"],
    "110": ["Đoài", "☱"],
    "101": ["Ly", "☲"],
    "100": ["Chấn", "☳"],
    "011": ["Tốn", "☴"],
    "010": ["Khảm", "☵"],
    "001": ["Cấn", "☶"],
    "000": ["Khôn", "☷"],
  };

  function computeTrigram(haos) {
    // haos: array 3 bool (true = Dương), từ dưới lên
    const key = haos.map(h => h ? "1" : "0").join("");
    return TRIGRAM_MAP[key] || ["?", "?"];
  }

  function renderQuaiInfo(results) {
    // results[0..5] = hào 1..6 (bottom → top)
    // Hạ quái = hào 1,2,3 (bottom) → reverse để map đúng key (top→bottom)
    // Theo convention: TRIGRAM_MAP key = hào từ trên xuống. Nhưng ta có hào dưới lên.
    // Vậy cần reverse 3 hào: [hào 3, hào 2, hào 1] → key
    const haTri = [results[2], results[1], results[0]].map(r => r.hao === "duong");
    const thuongTri = [results[5], results[4], results[3]].map(r => r.hao === "duong");

    const [haTen, haSym] = computeTrigram(haTri);
    const [thuongTen, thuongSym] = computeTrigram(thuongTri);

    const box = document.getElementById("quaiInfo");
    const tq = document.getElementById("thuongQuai");
    const tqs = document.getElementById("thuongSym");
    const hq = document.getElementById("haQuai");
    const hqs = document.getElementById("haSym");

    if (tq) tq.textContent = thuongTen;
    if (tqs) tqs.textContent = " " + thuongSym;
    if (hq) hq.textContent = haTen;
    if (hqs) hqs.textContent = " " + haSym;
    if (box) box.style.display = "flex";
  }

  function animateHaos() {
    const haosList = document.getElementById("haosList");
    const sub = document.getElementById("coinSub");
    const tray = document.getElementById("coinTray");
    let haoIdx = 0;
    const TOTAL = 6;
    const results = [];  // lưu kết quả 6 hào

    const step = () => {
      if (haoIdx >= TOTAL || !document.getElementById("haosList")) {
        return;
      }
      haoIdx++;

      // 1. Bắt đầu xoay
      const currentToss = tossCoins();
      renderCoinTray(tray, currentToss.coins, false);
      if (sub) sub.textContent = `Hào ${haoIdx}/6 — đang gieo 3 đồng...`;

      // 2. Sau 1.1s → dừng, lật mặt kết quả
      setTimeout(() => {
        renderCoinTray(tray, currentToss.coins, true);
        const label = currentToss.coins.map(c => c ? "Dương" : "Âm").join(" · ");
        if (sub) {
          sub.innerHTML = `Hào ${haoIdx}/6 — ${label} → <b>${currentToss.label}</b>`;
        }
        results.push(currentToss);

        // 3. Thêm hào vào list
        const row = document.createElement("div");
        row.className = "hao-line";
        const num = document.createElement("div");
        num.className = "hao-num";
        num.textContent = `Hào ${haoIdx}`;
        const bar = document.createElement("div");
        bar.className = "hao-bar";
        if (currentToss.hao === "duong") {
          bar.innerHTML = currentToss.dong
            ? '<div class="solid lao"></div><span class="mark-o">○</span>'
            : '<div class="solid"></div>';
        } else {
          bar.innerHTML = currentToss.dong
            ? '<div class="broken lao"><span></span><span></span></div><span class="mark-x">×</span>'
            : '<div class="broken"><span></span><span></span></div>';
        }
        const lbl = document.createElement("div");
        lbl.className = "hao-label";
        lbl.innerHTML = currentToss.dong
          ? `<span class="hao-dong">${currentToss.label} ●</span>`
          : currentToss.label;
        row.append(num, bar, lbl);
        haosList?.prepend(row);

        // 4. Nếu đã đủ 6 hào → hiển thị quái info
        if (haoIdx === TOTAL) {
          renderQuaiInfo(results);
        }

        // 5. Hào tiếp theo sau 0.6s
        setTimeout(step, 600);
      }, 1100);
    };

    step();
  }

  function hideLoading() {
    if (!loadingTimer) return;
    if (typeof loadingTimer === "number") { clearInterval(loadingTimer); }
    else {
      clearInterval(loadingTimer.textTimer);
      clearTimeout(loadingTimer.coinTimer);
      clearInterval(loadingTimer.haoTimer);
    }
    loadingTimer = null;
  }

  function removeAnimationOnly() {
    // Xoá CHỈ loading-box (bát quái), giữ coin-stage
    document.querySelector(".loading-box")?.remove();
  }

  document.getElementById("suggestTags")?.addEventListener("click", e => {
    const tag = e.target.closest(".suggest-tag");
    if (!tag) return;
    const ta = document.getElementById("question");
    const text = tag.dataset.text || "";
    const cur = ta.value.trim();
    ta.value = cur ? `${cur} ${text}` : text;
    ta.focus();
    // đưa cursor về cuối
    ta.setSelectionRange(ta.value.length, ta.value.length);
  });

  document.getElementById("form").addEventListener("submit", async event => {
    event.preventDefault();
    const button = document.getElementById("submit"); button.disabled = true;
    result.replaceChildren(); showLoading();
    try {
      const response = await fetch("/api/kinh-dich", {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: token ? `Bearer ${token}` : "" },
        body: JSON.stringify({ cau_hoi: document.getElementById("question").value })
      });
      const data = await response.json().catch(() => ({}));
      if (response.status === 401 && token) { localStorage.clear(); window.location.replace("/"); return; }
      if (!response.ok) throw new Error(data.detail || `Yêu cầu thất bại (${response.status}).`);
      // ── Layout: 3 cột cho quẻ + animation ──
      // ── 1 modal chính chứa 3 cột ──
      const mainModal = document.createElement("div");
      mainModal.className = "main-modal";

      const grid = document.createElement("div");
      grid.className = "modal-grid";

      const colChinh = document.createElement("div");
      renderHexagram(colChinh, data.que_chinh, "Quẻ chính");

      const colAnim = document.createElement("div");
      const animation = result.querySelector(".coin-stage");
      if (animation) {
        colAnim.append(animation);
        animation.style.opacity = "1";
      }

      const colBien = document.createElement("div");
      if (data.que_bien) renderHexagram(colBien, data.que_bien, "Quẻ biến");

      grid.append(colChinh, colAnim, colBien);
      mainModal.append(grid);

      const bottom = document.createElement("div");
      result.replaceChildren(mainModal, bottom);

      const lg = data.luan_giai || {};
      text(bottom, "h2", "📜 Diễn giải chi tiết");

      // Helper render section
      const section = (icon, title, content) => {
        if (!content) return;
        const h = document.createElement("h3");
        h.textContent = `${icon} ${title}`;
        h.style.color = "#c4a3ff";
        h.style.marginTop = "20px";
        h.style.marginBottom = "8px";
        h.style.fontSize = "1.05rem";
        result.append(h);
        // Split paragraphs by newline
        const paras = String(content).split(/\n\n+|\n/).filter(x => x.trim());
        paras.forEach(p => text(result, "p", p));
      };

      // Helper render list (with prefix)
      const listSection = (icon, title, items, prefix = "•") => {
        if (!items || !items.length) return;
        const h = document.createElement("h3");
        h.textContent = `${icon} ${title}`;
        h.style.color = "#c4a3ff";
        h.style.marginTop = "20px";
        h.style.marginBottom = "8px";
        h.style.fontSize = "1.05rem";
        result.append(h);
        items.forEach(it => text(result, "p", `${prefix} ${it.hanh_dong || it}`));
      };

      // ── Render từng section ──
      section("📖", "Tổng quan", lg.tong_quan);
      section("💡", "Ý nghĩa cốt lõi", lg.y_nghia_cot_loi);
      section("🔄", "Xu hướng biến hóa", lg.xu_huong_bien_hoa);
      section("🔍", "Phân tích theo câu hỏi của bạn", lg.phan_tich_theo_cau_hoi);

      // ── Tam Hợp: Thiên Thời - Địa Lợi - Nhân Hòa ──
      const tdn = lg.thien_dia_nhan || {};
      if (tdn.thien_thoi || tdn.dia_loi || tdn.nhan_hoa) {
        const h = document.createElement("h3");
        h.textContent = "🌏 Thiên Thời · Địa Lợi · Nhân Hòa";
        h.style.color = "#c4a3ff";
        h.style.marginTop = "24px";
        h.style.marginBottom = "10px";
        h.style.fontSize = "1.05rem";
        result.append(h);

        const tdnMap = [
          ["☀️", "Thiên Thời", tdn.thien_thoi, "#f5d76e"],
          ["🌍", "Địa Lợi", tdn.dia_loi, "#8fd9a8"],
          ["🤝", "Nhân Hòa", tdn.nhan_hoa, "#f5a9b8"],
        ];
        tdnMap.forEach(([icon, name, val, color]) => {
          if (!val || !String(val).trim()) return;
          const wrap = document.createElement("div");
          wrap.style.marginBottom = "12px";
          wrap.style.padding = "10px 14px";
          wrap.style.borderLeft = `3px solid ${color}`;
          wrap.style.background = "#ffffff06";
          wrap.style.borderRadius = "6px";
          const title = document.createElement("div");
          title.innerHTML = `<b style="color:${color}">${icon} ${name}</b>`;
          title.style.marginBottom = "4px";
          const content = document.createElement("div");
          content.textContent = val;
          content.style.fontSize = ".95rem";
          wrap.append(title, content);
          result.append(wrap);
        });

        if (tdn.tong_ket) {
          const tk = document.createElement("p");
          tk.style.marginTop = "8px";
          tk.style.padding = "10px 14px";
          tk.style.background = "#c4a3ff15";
          tk.style.borderRadius = "6px";
          tk.style.fontStyle = "italic";
          tk.innerHTML = `💎 <b>Tổng kết:</b> ${tdn.tong_ket}`;
          result.append(tk);
        }
      }

      // ── Theo lĩnh vực ──
      const lv = lg.theo_linh_vuc || {};
      const lvMap = [
        ["💕", "Tình duyên", lv.tinh_duyen],
        ["💼", "Sự nghiệp", lv.su_nghiep],
        ["🌿", "Sức khỏe", lv.suc_khoe],
        ["💰", "Tài vận", lv.tai_van],
        ["🎓", "Học hành", lv.hoc_hanh],
      ];
      const hasLv = lvMap.some(([,, v]) => v && String(v).trim());
      if (hasLv) {
        const h = document.createElement("h3");
        h.textContent = "🎯 Ứng dụng theo lĩnh vực";
        h.style.color = "#c4a3ff";
        h.style.marginTop = "20px";
        h.style.marginBottom = "8px";
        h.style.fontSize = "1.05rem";
        result.append(h);
        lvMap.forEach(([icon, name, val]) => {
          if (val && String(val).trim()) text(result, "p", `${icon} ${name}: ${val}`);
        });
      }

      // ── Hành động + cân nhắc ──
      listSection("📌", "Hành động cụ thể", lg.goi_y_hanh_dong, "→");
      listSection("⚠️", "Cần cân nhắc", lg.diem_can_can_nhac, "•");

      // ── Lời khuyên thời điểm ──
      section("⏰", "Lời khuyên thời điểm", lg.loi_khuyen_thoi_diem);

      // ── Fallback cho format cũ ──
      if (!lg.tong_quan && lg.thong_diep) section("💬", "Thông điệp", lg.thong_diep);

      // ── Giới hạn ──
      if (lg.gioi_han) {
        const g = document.createElement("p");
        g.className = "muted";
        g.style.marginTop = "16px";
        g.style.fontStyle = "italic";
        g.textContent = `📝 ${lg.gioi_han}`;
        result.append(g);
      }

      // ── Note chung ──
      if (data.ghi_chu) {
        const n = document.createElement("p");
        n.className = "muted";
        n.style.marginTop = "8px";
        n.style.fontSize = ".85rem";
        n.textContent = data.ghi_chu;
        result.append(n);
      }
    } catch (error) {
      result.replaceChildren(); text(result, "p", error.message || "Không thể hoàn tất yêu cầu.", "error");
    } finally { hideLoading(); button.disabled = false; }
  });
</script>  <script src="/nav.js"></script>
</body>
