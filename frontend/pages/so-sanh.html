<!doctype html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đông – Tây — Huyền Học AI</title>
<style>
  :root{color-scheme:dark;font:16px system-ui;background:#160a27;color:#e8dff5}body{margin:0;padding:24px 16px}main{max-width:760px;margin:auto}
  nav{display:flex;gap:12px;flex-wrap:wrap}a{color:#d0b5ff}section{padding:20px;margin:16px 0;border:1px solid #563c77;border-radius:12px;background:#ffffff09}
  label{display:block;margin:12px 0 5px}input,button{font:inherit;padding:10px;border-radius:7px}input{background:#201432;color:white;border:1px solid #705d83}
  button{background:#7138d6;color:white;border:0;cursor:pointer}.note{color:#b6a1d2}pre{white-space:pre-wrap;overflow-wrap:anywhere}
</style>  <link rel="stylesheet" href="/static/css/app.css">
</head><body><main>
  <h1>🔮 Góc nhìn Đông – Tây</h1><section><p class="note">So sánh biểu tượng để tự phản tư; không quy đổi hệ thống thành nhau, chấm độ tương hợp hay dự đoán.</p>
    <form id="form"><label>Ngày<input name="ngay" type="number" min="1" max="31" value="15" required></label>
      <label>Tháng<input name="thang" type="number" min="1" max="12" value="6" required></label>
      <label>Năm<input name="nam" type="number" min="1900" max="2100" value="1995" required></label>
      <button type="submit">Tính cung Mặt Trời tham khảo</button>
      <button id="compare" type="button">Đối chiếu với hồ sơ đã lưu</button></form><p id="error" role="alert"></p><pre id="result"></pre>
  </section>
</main><script>
  const token=localStorage.getItem("token");if(!token)location.replace("/");
  async function submitChart(path){
    const error=document.getElementById("error"),output=document.getElementById("result");error.textContent="";output.textContent="Đang tính…";
    const body=Object.fromEntries(new FormData(document.getElementById("form")));for(const key of ["ngay","thang","nam"])body[key]=Number(body[key]);
    try{const response=await fetch(path,{method:"POST",headers:{Authorization:`Bearer ${token}`,"Content-Type":"application/json"},body:JSON.stringify(body)});
      const data=await response.json();if(!response.ok)throw new Error(data.detail||`Lỗi ${response.status}`);
      output.textContent=JSON.stringify(data,null,2);
    }catch(e){output.textContent="";error.textContent=e.message}
  }
  document.getElementById("form").addEventListener("submit",event=>{event.preventDefault();submitChart("/api/tu-vi-tay/chart")});
  document.getElementById("compare").addEventListener("click",()=>submitChart("/api/tu-vi-tay/so-sanh"));
</script>  <script src="/nav.js"></script>
</body>
</html>
