<!doctype html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trạch cát — Huyền Học AI</title>
<style>
  :root{color-scheme:dark;font:16px system-ui;background:#160a27;color:#e8dff5}body{margin:0;padding:24px 16px}main{max-width:760px;margin:auto}
  nav{display:flex;gap:12px;flex-wrap:wrap}a{color:#d0b5ff}section{padding:20px;margin:16px 0;border:1px solid #563c77;border-radius:12px;background:#ffffff09}
  label{display:block;margin:12px 0 5px}input,select,button{font:inherit;padding:10px;border-radius:7px}input,select{background:#201432;color:white;border:1px solid #705d83}
  button{background:#7138d6;color:white;border:0;cursor:pointer}.note{color:#b6a1d2}pre{white-space:pre-wrap;overflow-wrap:anywhere}
</style>  <link rel="stylesheet" href="/static/css/app.css">
</head><body><main>
  <h1>🏯 Trạch cát — Lịch tham khảo</h1><section><p class="note">Ngày gợi ý dựa trên bảng lịch dân gian giản lược, không dự đoán kết quả. Không dùng để trì hoãn chăm sóc y tế, nghĩa vụ pháp lý hay hạn chót thực tế.</p>
    <form id="form"><label>Việc<select name="loai_viec">
      <option value="cuoi_hoi">Cưới hỏi</option><option value="khai_truong">Khai trương</option>
      <option value="ky_ket">Ký kết</option><option value="xuat_hanh">Xuất hành</option>
      <option value="dong_tho">Động thổ</option><option value="nhap_hoc">Nhập học</option>
      <option value="giao_dich">Giao dịch</option><option value="gap_go">Gặp gỡ</option><option value="chuyen_nha">Chuyển nhà</option>
    </select></label>
    <label>Bắt đầu từ ngày<input id="start" name="tu_ngay" type="date"></label>
    <label>Số ngày xem (1–90)<input name="so_ngay_tim" type="number" min="1" max="90" value="60"></label>
    <button type="submit">Tìm ngày tham khảo</button></form><p id="error" role="alert"></p><pre id="result"></pre>
  </section>
</main><script>
  const token=localStorage.getItem("token");if(!token)location.replace("/");
  document.getElementById("start").value=new Date().toLocaleDateString("en-CA");
  document.getElementById("form").addEventListener("submit",async event=>{
    event.preventDefault();const error=document.getElementById("error"),output=document.getElementById("result");error.textContent="";output.textContent="Đang tìm…";
    const data=Object.fromEntries(new FormData(event.currentTarget));data.so_ngay_tim=Number(data.so_ngay_tim);data.so_ket_qua=10;if(!data.tu_ngay)delete data.tu_ngay;
    try{const response=await fetch("/api/trach-cat/tim-ngay",{method:"POST",headers:{Authorization:`Bearer ${token}`,"Content-Type":"application/json"},body:JSON.stringify(data)});
      const body=await response.json();if(!response.ok)throw new Error(body.detail||`Lỗi ${response.status}`);output.textContent=JSON.stringify(body,null,2);
    }catch(e){output.textContent="";error.textContent=e.message}
  });
</script>  <script src="/nav.js"></script>
</body>
</html>
