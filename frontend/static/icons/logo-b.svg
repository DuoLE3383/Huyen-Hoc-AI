<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 256" width="640" height="256" role="img" aria-label="Huyền Học AI">
  <defs>
    <linearGradient id="bgB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="55%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#FCD34D"/>
    </linearGradient>
    <linearGradient id="ringB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F97316" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="textB" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <radialGradient id="moonB" cx="35%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#FFF7D6"/>
      <stop offset="100%" stop-color="#FCD34D"/>
    </radialGradient>
  </defs>

  <!-- Icon block (left) -->
  <g transform="translate(16 16)">
    <rect x="0" y="0" width="224" height="224" rx="56" fill="url(#bgB)"/>

    <!-- Bát quái ring: 8 trigrams -->
    <g transform="translate(112 112)">
      <g fill="url(#ringB)">
        <g transform="rotate(0)"><rect x="-11" y="-85" width="22" height="3.5" rx="1.75"/><rect x="-11" y="-78" width="22" height="3.5" rx="1.75"/><rect x="-11" y="-71" width="22" height="3.5" rx="1.75"/></g>
        <g transform="rotate(45)"><rect x="-11" y="-85" width="22" height="3.5" rx="1.75"/><rect x="-11" y="-78" width="22" height="3.5" rx="1.75"/><rect x="-11" y="-71" width="22" height="3.5" rx="1.75"/></g>
        <g transform="rotate(90)"><rect x="-11" y="-85" width="22" height="3.5" rx="1.75"/><rect x="-11" y="-78" width="22" height="3.5" rx="1.75"/><rect x="-11" y="-71" width="22" height="3.5" rx="1.75"/></g>
        <g transform="rotate(135)"><rect x="-11" y="-85" width="22" height="3.5" rx="1.75"/><rect x="-11" y="-78" width="22" height="3.5" rx="1.75"/><rect x="-11" y="-71" width="22" height="3.5" rx="1.75"/></g>
        <g transform="rotate(180)"><rect x="-11" y="-85" width="22" height="3.5" rx="1.75"/><rect x="-11" y="-78" width="22" height="3.5" rx="1.75"/><rect x="-11" y="-71" width="22" height="3.5" rx="1.75"/></g>
        <g transform="rotate(225)"><rect x="-11" y="-85" width="22" height="3.5" rx="1.75"/><rect x="-11" y="-78" width="22" height="3.5" rx="1.75"/><rect x="-11" y="-71" width="22" height="3.5" rx="1.75"/></g>
        <g transform="rotate(270)"><rect x="-11" y="-85" width="22" height="3.5" rx="1.75"/><rect x="-11" y="-78" width="22" height="3.5" rx="1.75"/><rect x="-11" y="-71" width="22" height="3.5" rx="1.75"/></g>
        <g transform="rotate(315)"><rect x="-11" y="-85" width="22" height="3.5" rx="1.75"/><rect x="-11" y="-78" width="22" height="3.5" rx="1.75"/><rect x="-11" y="-71" width="22" height="3.5" rx="1.75"/></g>
      </g>
    </g>

    <!-- Moon crescent -->
    <g transform="translate(112 112)">
      <circle r="32" fill="url(#moonB)"/>
      <circle cx="12" cy="-6" r="28" fill="url(#bgB)"/>
    </g>

    <!-- Sparkle -->
    <g transform="translate(154 148)" fill="#FFF7D6">
      <path d="M 0 -14 L 3 -3 L 14 0 L 3 3 L 0 14 L -3 3 L -14 0 L -3 -3 Z"/>
    </g>
  </g>

  <!-- Text "HB" (right) -->
  <g transform="translate(272 128)">
    <text x="0" y="0"
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
          font-size="140"
          font-weight="800"
          letter-spacing="-4"
          fill="url(#textB)"
          dominant-baseline="middle"
          text-anchor="start">HB</text>
  </g>
</svg>
