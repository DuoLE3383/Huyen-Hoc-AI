<!doctype html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bản đồ địa lý — Huyền Học AI</title>
<style>
  :root{color-scheme:dark;font:16px system-ui;background:#160a27;color:#e8dff5}body{margin:0;padding:24px 16px}main{max-width:760px;margin:auto}
  nav{display:flex;gap:12px;flex-wrap:wrap}a{color:#d0b5ff}section{padding:20px;margin:16px 0;border:1px solid #563c77;border-radius:12px;background:#ffffff09}
  label{display:block;margin:12px 0 5px}input,select,button{font:inherit;padding:10px;border-radius:7px}input,select{background:#201432;color:white;border:1px solid #705d83}
  button{background:#7138d6;color:white;border:0;cursor:pointer}.note{color:#b6a1d2}pre{white-space:pre-wrap;overflow-wrap:anywhere}
</style></head><body><main>
  <h1>🗺️ Vị trí & dữ liệu địa lý</h1><nav><a href="/app">Tổng quan</a><a href="/gia-dao">Gia đạo</a><a href="/kinh-te">Kinh tế</a></nav>
  <p class="note">Tọa độ không cho biết hướng mặt tiền. Hãy nhập hướng đã đo/biết. Không chấm điểm bất động sản hay suy ra an toàn/đầu tư từ phong thủy.</p>
  <section><form id="form">
    <label>Vĩ độ<input id="lat" name="lat" type="number" step="any" min="-90" max="90" required></label>
    <label>Kinh độ<input id="lon" name="lon" type="number" step="any" min="-180" max="180" required></label>
    <button id="locate" type="button">Dùng vị trí thiết bị…</button>
    <label>Hướng mặt tiền đã biết<select name="huong_dat" required>
      <option value="" selected disabled>Chọn hướng đã biết</option>
      <option>Bắc</option><option>Đông Bắc</option><option>Đông</option><option>Đông Nam</option>
      <option>Nam</option><option>Tây Nam</option><option>Tây</option><option>Tây Bắc</option>
    </select></label>
    <label><input id="consent" type="checkbox"> Tôi đồng ý gửi tọa độ tới Google Maps để lấy độ cao (chỉ khi dịch vụ được cấu hình).</label>
    <button type="submit">Xem dữ liệu địa lý</button>
  </form><p id="error" role="alert"></p><pre id="result"></pre></section>
</main><script>
  const token=localStorage.getItem("token");if(!token)location.replace("/");
  const error=document.getElementById("error"),result=document.getElementById("result");
  document.getElementById("locate").addEventListener("click",()=>{
    error.textContent="";if(!navigator.geolocation){error.textContent="Trình duyệt không hỗ trợ vị trí.";return}
    navigator.geolocation.getCurrentPosition(pos=>{document.getElementById("lat").value=pos.coords.latitude.toFixed(6);document.getElementById("lon").value=pos.coords.longitude.toFixed(6)},()=>{error.textContent="Không lấy được vị trí. Bạn có thể nhập tọa độ thủ công."},{timeout:10000});
  });
  document.getElementById("form").addEventListener("submit",async event=>{
    event.preventDefault();error.textContent="";result.textContent="Đang tải…";
    try{
      const body=Object.fromEntries(new FormData(event.currentTarget));body.lat=Number(body.lat);body.lon=Number(body.lon);body.truy_van_do_cao=document.getElementById("consent").checked;
      const response=await fetch("/api/ban-do/phan-tich",{method:"POST",headers:{Authorization:`Bearer ${token}`,"Content-Type":"application/json"},body:JSON.stringify(body)});
      const data=await response.json();if(!response.ok)throw new Error(data.detail||`Lỗi ${response.status}`);
      result.textContent=JSON.stringify(data,null,2);
    }catch(e){result.textContent="";error.textContent=e.message}
  });
</script></body></html>
