<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1a0b2e">
  <title>Tarot · Huyền Học AI</title>
  <style>
    body { margin:0; padding:24px 14px; color:#e8dff5; background:#0f0524; font:16px system-ui,sans-serif; }
    main { width:min(850px,100%); margin:auto; } h1,h2 { color:#c4a3ff; }
    nav, .actions { display:flex; flex-wrap:wrap; gap:9px; margin:16px 0; }
    a, button { padding:9px 13px; border:1px solid #c4a3ff; border-radius:8px; color:#e8dff5; background:#7138d6; text-decoration:none; cursor:pointer; }
    nav a { background:transparent; } textarea, select { width:100%; padding:10px; border:1px solid #c4a3ff66; border-radius:8px; color:#fff; background:#170b2d; font:inherit; }
    label { display:block; margin:10px 0 5px; color:#c7b8d8; } .card { margin:10px 0; padding:14px; border:1px solid #c4a3ff55; border-radius:10px; background:#ffffff0b; }
    .muted { color:#b6a1d2; font-size:.9rem; } .error { color:#ff9999; }
  </style>
</head>
<body><main>
  <h1>🃏 Trải bài Tarot</h1>
  <nav aria-label="Điều hướng"><a href="/app">Tổng quan</a><a href="/tu-vi">Tử Vi</a><a href="/hop-tuoi">Hợp tuổi</a><a href="/kinh-dich">Kinh Dịch</a><button id="logout" type="button">Đăng xuất</button></nav>
  <p class="muted">Bài rút ngẫu nhiên để tự chiêm nghiệm; không phải dự đoán chắc chắn hay lời khuyên chuyên môn.</p>
  <form id="form">
    <label for="question">Câu hỏi để suy ngẫm (5–500 ký tự)</label>
    <textarea id="question" required minlength="5" maxlength="500" rows="4"></textarea>
    <label for="spread">Số lá</label>
    <select id="spread"><option value="1">1 lá</option><option value="3" selected>3 lá</option><option value="5">5 lá</option></select>
    <div class="actions"><button id="submit" type="submit">Rút bài</button></div>
  </form>
  <section id="result" aria-live="polite"></section>
</main>
<script>
  const token = localStorage.getItem("token");
  if (!token) window.location.replace("/");
  document.getElementById("logout").addEventListener("click", () => { localStorage.clear(); window.location.replace("/"); });
  const result = document.getElementById("result");
  function addText(parent, tag, text, className) {
    const element = document.createElement(tag);
    element.textContent = text ?? "";
    if (className) element.className = className;
    parent.append(element);
    return element;
  }
  document.getElementById("form").addEventListener("submit", async event => {
    event.preventDefault();
    const button = document.getElementById("submit");
    button.disabled = true;
    result.replaceChildren();
    addText(result, "p", "Đang rút bài và diễn giải…", "muted");
    try {
      const response = await fetch("/api/tarot", {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
        body: JSON.stringify({ cau_hoi: document.getElementById("question").value, so_la: Number(document.getElementById("spread").value) })
      });
      const data = await response.json().catch(() => ({}));
      if (response.status === 401) { localStorage.clear(); window.location.replace("/"); return; }
      if (!response.ok) throw new Error(data.detail || `Yêu cầu thất bại (${response.status}).`);
      result.replaceChildren();
      const interpretation = data.luan_giai || {};
      addText(result, "h2", interpretation.thong_diep_chinh || "Thông điệp");
      for (const card of data.cards || []) {
        const section = document.createElement("article"); section.className = "card";
        addText(section, "h3", `${card.vi_tri}: ${card.vn}${card.reversed ? " (ngược)" : ""}`);
        addText(section, "p", `Từ khóa: ${card.keyword}`, "muted");
        const detail = (interpretation.luan_giai_tung_la || []).find(item => item.vi_tri === card.vi_tri);
        if (detail) addText(section, "p", detail.y_nghia);
        result.append(section);
      }
      addText(result, "p", interpretation.tong_hop || "");
      for (const item of interpretation.loi_khuyen_cu_the || []) addText(result, "p", `Gợi ý: ${item.hanh_dong}`);
      for (const warning of interpretation.canh_bao || []) addText(result, "p", warning, "muted");
      addText(result, "p", data.ghi_chu, "muted");
    } catch (error) {
      result.replaceChildren();
      addText(result, "p", error.message || "Không thể hoàn tất yêu cầu.", "error");
    } finally { button.disabled = false; }
  });
</script></body></html>
